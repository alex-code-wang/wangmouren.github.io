<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天机器人</title>
    <link rel="stylesheet" href="chatbot.css">
</head>
<body>
    <div style="padding: 2rem; max-width: 800px; margin: 0 auto;">
        <h1>聊天机器人演示页面</h1>
        <p>点击右下角的机器人按钮打开聊天窗口</p>
        
        <div style="margin-top: 2rem; padding: 1rem; background: #f0f4f8; border-radius: 8px;">
            <h3>百度文心一言 API 申请步骤：</h3>
            <ol style="line-height: 2;">
                <li>访问 <a href="https://cloud.baidu.com/" target="_blank">百度智能云官网</a></li>
                <li>注册/登录百度账号</li>
                <li>进入 "文心一言API" 产品页面</li>
                <li>创建应用，获取 API Key 和 Secret Key</li>
                <li>将这两个Key复制到聊天窗口顶部输入框中</li>
            </ol>
        </div>
    </div>

    <!-- 聊天机器人组件 -->
    <div class="chatbot-container">
        <button class="chatbot-button" id="chatbot-button">
            🤖
        </button>
        <div class="chatbot-window" id="chatbot-window">
            <div class="chatbot-header">
                <div class="chatbot-avatar">🤖</div>
                <div class="chatbot-title">
                    <h4>AI 助手</h4>
                    <p>在线</p>
                </div>
                <button class="chatbot-close" id="chatbot-close">×</button>
            </div>
            <div class="chatbot-api-key">
                <input type="text" id="chatbot-api-key" placeholder="API Key">
                <input type="text" id="chatbot-secret-key" placeholder="Secret Key">
                <button id="chatbot-save-key">保存</button>
            </div>
            <div class="chatbot-messages" id="chatbot-messages"></div>
            <div class="chatbot-input-area">
                <input type="text" id="chatbot-input" class="chatbot-input" placeholder="输入消息...">
                <button class="chatbot-send" id="chatbot-send">→</button>
            </div>
        </div>
    </div>

    <script src="chatbot.js"></script>
</body>
</html>
